name: Weekly rebuild

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for new release'
        required: true
        default: 'v2020.01.01-alpha'
      draft:
        description: 'Draft release? (true/false)'
        required: true
        default: 'true'
  schedule:
    - cron: '10 2 * * 0'

permissions:
  contents: write # create the release and push to gh-pages

jobs:
  generate:
    name: generate annotated epub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy calibre python3-venv
          # ebookmaker in a venv: Ubuntu's system Python is externally managed.
          python3 -m venv "$HOME/ebm"
          "$HOME/ebm/bin/pip" install --upgrade pip setuptools
          "$HOME/ebm/bin/pip" install ebookmaker pytidylib
          echo "$HOME/ebm/bin" >> "$GITHUB_PATH"
      - name: get mime
        run: |
          curl -fOL https://github.com/shsms/mime-rs/releases/download/v0.1.0/mime-linux-x86_64.tar.gz
          # Pin the v0.1.0 asset's checksum; update it when bumping the version.
          echo "2ebfc3ce2f47707dce1bc398208462469665a91316f1852ba30c13b76e895a2a  mime-linux-x86_64.tar.gz" | sha256sum -c -
          tar -xzf mime-linux-x86_64.tar.gz
          chmod +x mime
      - name: download annotations
        run: make -C scripts download
        timeout-minutes: 30
      - name: add annotations
        run: |
          MIME=../mime make -C scripts addanno
          mkdir -p reader/badges
          cp scripts/badge-*json reader/badges/
          cp scripts/unmatched.txt scripts/broken-links.txt scripts/build-report.txt reader/badges/
      - name: generate epub
        run: |
          make -C scripts epub
          cp ulysses-annotated.epub reader/
      - name: Create the release and upload the epubs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          DRAFT_INPUT: ${{ github.event.inputs.draft }}
        run: |
          if [ -n "$TAG_INPUT" ]; then tag="$TAG_INPUT"; else tag="v$(date +%Y.%m.%d)"; fi
          draft=
          if [ "$DRAFT_INPUT" = "true" ]; then draft=--draft; fi
          gh release create "$tag" ulysses-annotated*.epub \
            --title "$tag" --generate-notes $draft
      - name: Deploy the web reader to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd reader
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Deploy web reader (${GITHUB_SHA})"
          # Auth via a transient header so the token never lands in the remote URL.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push -f "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
